name: Task
description: A specific piece of work
title: "[TASK] "
labels: ["Task 💪"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know it's done? One checkbox per criterion.
      value: |
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Infra/CI
        - API
        - Trading
        - Ledger
        - Web
        - Documentation
        - BCM
        - BCPM
